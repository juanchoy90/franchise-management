# Local Development Profile (LocalStack)

aws:
  dynamodb:
    table-name: FranchiseManagement
    endpoint: http://localhost:4566
    region: us-east-1
    max-concurrency: 10
    connection-acquisition-timeout: 3000
    connection-timeout: 3000
    read-timeout: 3000
    resilience-instance: dynamodb

resilience4j:
  circuitbreaker:
    instances:
      dynamodb:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 80
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 5s
        record-exceptions:
          - software.amazon.awssdk.core.exception.SdkClientException
          - software.amazon.awssdk.services.dynamodb.model.DynamoDbException
  
  retry:
    instances:
      dynamodb:
        max-attempts: 5
        wait-duration: 1000ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - software.amazon.awssdk.services.dynamodb.model.ProvisionedThroughputExceededException
          - software.amazon.awssdk.services.dynamodb.model.RequestLimitExceededException
          - software.amazon.awssdk.core.exception.SdkClientException
  
  timelimiter:
    instances:
      dynamodb:
        timeout-duration: 5000ms
        cancel-running-future: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    co.com.juandavidg.franchise_management: DEBUG
    software.amazon.awssdk: DEBUG
    io.github.resilience4j: DEBUG
    reactor.netty: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
